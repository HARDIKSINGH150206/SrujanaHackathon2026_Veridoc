# VeriDoc's own local stack. It has its own project name, container names, host
# ports and volumes, so it can run next to the old DigiVault containers
# (digivault-postgres on :5434, digivault-minio on :9000 and :9001) without
# touching them. Every value below can be changed in .env (see .env.example).
name: veridoc

services:
  postgres:
    image: postgres:17-alpine
    container_name: veridoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${VERIDOC_DB_USER:-veridoc}
      POSTGRES_PASSWORD: ${VERIDOC_DB_PASSWORD:-veridoc}
      POSTGRES_DB: ${VERIDOC_DB_NAME:-veridoc}
    ports:
      - "127.0.0.1:${VERIDOC_POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # Docker Hub anonymous pulls of minio/minio are blocked in this
    # environment ("pull access denied") — quay.io mirror works.
    image: quay.io/minio/minio:latest
    container_name: veridoc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${VERIDOC_MINIO_USER:-veridoc}
      MINIO_ROOT_PASSWORD: ${VERIDOC_MINIO_PASSWORD:-veridoc123}
    ports:
      - "127.0.0.1:${VERIDOC_MINIO_PORT:-9100}:9000"
      - "127.0.0.1:${VERIDOC_MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

# With the project name above these become veridoc_postgres_data and veridoc_minio_data.
volumes:
  postgres_data:
  minio_data:
