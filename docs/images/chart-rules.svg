<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-label="Rules audit"><rect width="800" height="270" rx="12" fill="#0d1117" stroke="#30363d"/><text x="28" y="36" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#e6edf3" font-weight="600" text-anchor="start">What the rules layer does to model errors</text><text x="28" y="58" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e" font-weight="400" text-anchor="start">v3 model on the pendrive, 378 terms. 39.4% of terms were wrong before the rules.</text><text x="28" y="102" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start">Errors caught and sent to review</text><rect x="330" y="88" width="440" height="18" rx="3" fill="#30363d" opacity="0.5"/><rect x="330" y="88" width="315.9" height="18" rx="3" fill="#3fb950"/><text x="653.9200000000001" y="102" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="start">71.8%</text><text x="28" y="144" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start">Errors not flagged</text><rect x="330" y="130" width="440" height="18" rx="3" fill="#30363d" opacity="0.5"/><rect x="330" y="130" width="48.8" height="18" rx="3" fill="#f85149"/><text x="386.84000000000003" y="144" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="start">11.1%</text><text x="28" y="186" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start">Correct terms wrongly flagged</text><rect x="330" y="172" width="440" height="18" rx="3" fill="#30363d" opacity="0.5"/><rect x="330" y="172" width="14.1" height="18" rx="3" fill