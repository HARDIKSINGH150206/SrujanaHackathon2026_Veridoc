<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-label="Training data mix"><rect width="800" height="270" rx="12" fill="#0d1117" stroke="#30363d"/><text x="28" y="36" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#e6edf3" font-weight="600" text-anchor="start">Training data: 6,480 chats</text><text x="28" y="58" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e" font-weight="400" text-anchor="start">Most data is synthetic because no labelled Indian WhatsApp deal dataset was found.</text><rect x="28.0" y="76" width="344.4" height="30" fill="#2f81f7"/><rect x="372.4" y="76" width="172.2" height="30" fill="#a371f7"/><rect x="544.7" y="76" width="172.2" height="30" fill="#d29922"/><rect x="716.9" y="76" width="55.1" height="30" fill="#3fb950"/><rect x="28" y="129" width="12" height="12" rx="2" fill="#2f81f7"/><text x="50" y="140" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start">Template chats (EN, Hinglish, Kannada-English)</text><text x="560" y="140" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="end">3,000</text><text x="580" y="140" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e" font-weight="400" text-anchor="start">46.3%  synthetic</text><rect x="28" y="159" width="12" height="12" rx="2" fill="#a371f7"/><text x="50" y="170" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start">Negotiation chats</text><text x="560" y="170" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="end">1,500</text><text x="580" y="170" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e" font-weight="400" text-anchor="start">23.1%  synthetic</text><rect x="28" y="189" width="12" height="12" rx="2" fill="#d29922"/><text x="50" y="200" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start">CraigslistBargains (US English)</text><text x="560" y="200" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="end">1,500</text><text x="580" y="200" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e" font-weight="400" text-anchor="start">23.1%  real</text><rect x="28" y="219" width="12" height="12" rx="2" fill="#3fb950"/><text x="50" y="230" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start">Realistic WhatsApp-style exports</text><text x="560" y="230" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="end">480</text><text x="580" y="230" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e" font-weight="400" text-anchor="start">7.4%  synthetic</text></svg>